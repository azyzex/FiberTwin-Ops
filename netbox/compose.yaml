# NetBox for the lab and for CI (Slice 2): the inventory view of sot/network.yaml.
# Lab-only throwaway credentials: this NetBox holds no secrets and listens on localhost only.
name: ft-netbox
services:
  netbox:
    image: netboxcommunity/netbox:v4.2.9
    depends_on: [postgres, redis]
    ports: ["127.0.0.1:8080:8080"]
    environment: &nb
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: lab-only-netbox
      REDIS_HOST: redis
      REDIS_CACHE_HOST: redis
      REDIS_PASSWORD: ""
      REDIS_CACHE_PASSWORD: ""
      SECRET_KEY: lab-only-0123456789abcdefghijklmnopqrstuvwxyz-0123456789
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.invalid
      SUPERUSER_PASSWORD: lab-only-admin
      SUPERUSER_API_TOKEN: 0123456789abcdef0123456789abcdef01234567
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/login/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: lab-only-netbox
  redis:
    image: redis:7.4-alpine
