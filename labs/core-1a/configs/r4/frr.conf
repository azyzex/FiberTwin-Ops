frr defaults traditional
hostname r4
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.4/32
 ip ospf area 0
!
interface eth2
 description L41 to r1
 ip address 10.1.14.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf bfd profile core
!
interface eth1
 description L34 to r3
 ip address 10.1.34.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf bfd profile core
!
router ospf
 ospf router-id 10.0.0.4
 passive-interface lo
!
bfd
 profile core
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 !
!
router bgp 65000
 bgp router-id 10.0.0.4
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.0.1 description iBGP r1
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description iBGP r2
 neighbor 10.0.0.3 remote-as 65000
 neighbor 10.0.0.3 update-source lo
 neighbor 10.0.0.3 description iBGP r3
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.3 activate
 exit-address-family
!
