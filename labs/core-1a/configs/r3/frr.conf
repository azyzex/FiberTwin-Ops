frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.3/32
 ip ospf area 0
!
interface eth3
 description L13 to r1
 ip address 10.1.13.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf bfd profile core
!
interface eth1
 description L23 to r2
 ip address 10.1.23.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf bfd profile core
!
interface eth2
 description L34 to r4
 ip address 10.1.34.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf bfd profile core
!
interface eth4
 description customer LAN (h3)
 ip address 100.64.3.1/24
!
router ospf
 ospf router-id 10.0.0.3
 passive-interface lo
!
bfd
 profile core
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 !
!
router bgp 65000
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source lo
 neighbor 10.0.0.1 description iBGP r1
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description iBGP r2
 neighbor 10.0.0.4 remote-as 65000
 neighbor 10.0.0.4 update-source lo
 neighbor 10.0.0.4 description iBGP r4
 address-family ipv4 unicast
  network 100.64.3.0/24
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.4 activate
 exit-address-family
!
