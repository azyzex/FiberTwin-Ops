frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
 ip ospf area 0
!
interface eth1
 description L12 to r2
 ip address 10.1.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf bfd profile core
!
interface eth2
 description L41 to r4
 ip address 10.1.14.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf bfd profile core
!
interface eth3
 description L13 to r3
 ip address 10.1.13.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf bfd profile core
!
interface eth4
 description eBGP to up1 (AS 65001)
 ip address 10.2.1.1/30
!
router ospf
 ospf router-id 10.0.0.1
 passive-interface lo
!
bfd
 profile core
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 !
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.0.2 remote-as 65000
 neighbor 10.0.0.2 update-source lo
 neighbor 10.0.0.2 description iBGP r2
 neighbor 10.0.0.3 remote-as 65000
 neighbor 10.0.0.3 update-source lo
 neighbor 10.0.0.3 description iBGP r3
 neighbor 10.0.0.4 remote-as 65000
 neighbor 10.0.0.4 update-source lo
 neighbor 10.0.0.4 description iBGP r4
 neighbor 10.2.1.2 remote-as 65001
 neighbor 10.2.1.2 description eBGP upstream up1
 address-family ipv4 unicast
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.4 activate
  neighbor 10.2.1.2 activate
  neighbor 10.0.0.2 next-hop-self
  neighbor 10.0.0.3 next-hop-self
  neighbor 10.0.0.4 next-hop-self
 exit-address-family
!
