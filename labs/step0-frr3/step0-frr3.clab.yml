# Step 0 smoke lab: 3 FRR routers in a triangle running OSPF.
# Goal: prove the laptop can run real routers that talk OSPF and forward packets.
#
#          r1 (10.0.0.1)
#         /  \
#  10.1.12  10.1.13
#       /      \
#     r2 ------ r3
#   (10.0.0.2) 10.1.23 (10.0.0.3)
name: step0-frr3

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.2.1
  nodes:
    r1:
      binds: [r1/daemons:/etc/frr/daemons, r1/frr.conf:/etc/frr/frr.conf]
    r2:
      binds: [r2/daemons:/etc/frr/daemons, r2/frr.conf:/etc/frr/frr.conf]
    r3:
      binds: [r3/daemons:/etc/frr/daemons, r3/frr.conf:/etc/frr/frr.conf]
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.1.12.0/30
    - endpoints: ["r1:eth2", "r3:eth1"]   # 10.1.13.0/30
    - endpoints: ["r2:eth2", "r3:eth2"]   # 10.1.23.0/30
