frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.2/32
 ip ospf area 0
!
interface eth1
 ip address 10.1.12.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.1.23.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.0.0.2
!
