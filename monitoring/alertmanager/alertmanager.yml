route:
  receiver: slack
  group_by: [alertname, link, node]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h
# a link alert explains the path symptoms it causes: send the cause, not every symptom
inhibit_rules:
  - source_matchers: [alertname =~ "FtLinkPacketLoss|FtLinkDown"]
    target_matchers: [alertname =~ "FtPathLoss|FtLatencyRising"]
receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light: NOC{{ else }}:white_check_mark: NOC resolved{{ end }}: {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
