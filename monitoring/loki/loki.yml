# Single-process Loki for the lab: filesystem storage, 3-day retention, ruler -> Alertmanager
auth_enabled: false
server: { http_listen_port: 3100, log_level: warn }
common:
  path_prefix: /loki
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
  storage: { filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules-tmp } }
schema_config:
  configs:
    - { from: "2026-01-01", store: tsdb, object_store: filesystem, schema: v13, index: { prefix: index_, period: 24h } }
limits_config: { retention_period: 72h, allow_structured_metadata: true }
compactor: { working_directory: /loki/compactor, retention_enabled: true, delete_request_store: filesystem }
ruler:
  storage: { type: local, local: { directory: /etc/loki/rules } }   # rules generated from Sigma
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  evaluation_interval: 10s
