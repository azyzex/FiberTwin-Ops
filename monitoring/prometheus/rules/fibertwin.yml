groups:
  - name: fibertwin-recording
    rules:
      # packet loss caused on each link by its netem impairment (worst direction), over the last 15 s (3 scrapes: faster, slightly noisier)
      - record: ft:link_loss_ratio
        expr: max by (link) (rate(ft_netem_dropped_total[15s]) / ((rate(ft_netem_sent_packets_total[15s]) + rate(ft_netem_dropped_total[15s])) > 0))
      # utilisation of each link (worst direction)
      - record: ft:link_util_ratio
        expr: max by (link) (rate(ft_iface_tx_bytes_total[30s]) * 8) / on (link) ft_link_capacity_bps
      # map colour: 0 ok, 1 warning, 2 critical. Every term is reduced to {link} so they add up;
      # a missing term counts as healthy (the "or" fallback), never as "drop this link".
      - record: ft:link_zero
        expr: max by (link) (ft_link_capacity_bps) * 0
      - record: ft:link_health
        expr: |
          clamp_max(
              2 * ((ft:link_loss_ratio or ft:link_zero) > bool 0.01)
            + ((ft:link_loss_ratio or ft:link_zero) > bool 0.001)
            + ((ft:link_util_ratio or ft:link_zero) > bool 0.8)
            + 2 * ((min by (link) (ft_iface_up)) == bool 0)
            + ((max by (link) (ft_optical_margin_db) or (ft:link_zero + 99)) < bool 3)
          , 2)

  - name: fibertwin-alerts
    rules:
      - alert: FtLinkPacketLoss
        expr: ft:link_loss_ratio > 0.01
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "Packet loss {{ $value | humanizePercentage }} on link {{ $labels.link }}"
      - alert: FtLinkDown
        expr: min by (link) (ft_iface_up) == 0
        for: 5s
        labels: { severity: critical }
        annotations:
          summary: "Link {{ $labels.link }} is down"
      - alert: FtLinkUtilisationHigh
        expr: ft:link_util_ratio > 0.8
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "Link {{ $labels.link }} at {{ $value | humanizePercentage }} of capacity"
      - alert: FtOspfAdjacencyMissing
        expr: ft_ospf_full_neighbors < ft_ospf_expected_neighbors
        for: 20s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }} has fewer OSPF Full neighbours than the source of truth expects"
      # optical layer: act on the MARGIN, before any packet is lost
      - alert: FtOsnrMarginLow
        expr: ft_optical_margin_db < 3
        for: 15s
        labels: { severity: warning }
        annotations:
          summary: "OSNR margin {{ $value | printf \"%.1f\" }} dB on {{ $labels.link }} (cliff at 0 dB)"
      # trend: at the current slope, the margin reaches the cliff within 10 minutes
      - alert: FtOsnrMarginTrend
        expr: (predict_linear(ft_optical_margin_db[2m], 600) < 0) and (deriv(ft_optical_margin_db[2m]) < -0.005)
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "OSNR margin on {{ $labels.link }} falling: cliff in < 10 min at this rate"
      # access (GPON budget per ONT and direction): act before the ONT reaches its receiver sensitivity
      - alert: FtPonMarginLow
        expr: min by (ont) (ft_pon_margin_db) < 3
        for: 15s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.ont }}: optical margin {{ $value | printf \"%.1f\" }} dB to receiver sensitivity"
      - alert: FtPonMarginTrend
        expr: (min by (ont) (predict_linear(ft_pon_margin_db[2m], 600)) < 0) and (min by (ont) (deriv(ft_pon_margin_db[2m])) < -0.002)
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.ont }}: optical margin falling, sensitivity reached in < 10 min at this rate"
      - alert: FtOntLos
        expr: min by (ont) (ft_pon_margin_db) < -5
        for: 5s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.ont }}: loss of signal (ONT down)"
      # symptom seen by customers (end to end); suppressed in Alertmanager when a link alert explains it
      - alert: FtPathLoss
        expr: max by (src, dst) (ft_probe_loss_ratio) > 0.02
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.src }} -> {{ $labels.dst }} probes lose {{ $value | humanizePercentage }}"
      # trend, not threshold: latency of the last minute vs the previous 15 minutes
      - alert: FtLatencyRising
        expr: |
          (avg_over_time(ft_probe_rtt_ms[1m]) > 1.5 * avg_over_time(ft_probe_rtt_ms[15m] offset 1m))
          and (avg_over_time(ft_probe_rtt_ms[1m]) - avg_over_time(ft_probe_rtt_ms[15m] offset 1m) > 1)
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Latency rising on {{ $labels.src }} -> {{ $labels.dst }} ({{ $labels.class }})"
