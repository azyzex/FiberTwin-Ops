# Monitoring for the twin. Start: FT_ROOT=<repo path> docker compose up -d   (see monitoring/up.sh)
name: ft-monitoring
services:
  exporter:
    build: ./exporter
    image: fibertwin/lab-exporter:0.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # root-equivalent: lab only, documented
      - ${FT_ROOT}/build:/ft/build:ro
      - ${FT_ROOT}/sot:/ft/sot:ro
    restart: unless-stopped
    mem_limit: 128m
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    mem_limit: 384m
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${SLACK_WEBHOOK_FILE}:/etc/alertmanager/secrets/slack-webhook:ro
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped
    mem_limit: 64m
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/noc.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    mem_limit: 256m
volumes:
  prom-data:
  grafana-data:
