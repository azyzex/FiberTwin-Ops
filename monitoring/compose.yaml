# Monitoring for the twin. Start: FT_ROOT=<repo path> docker compose up -d   (see monitoring/up.sh)
name: ft-monitoring
services:
  exporter:
    build: ./exporter
    image: fibertwin/lab-exporter:0.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # root-equivalent: lab only, documented
      - ${FT_ROOT}/build:/ft/build:ro
      - ${FT_ROOT}/sot:/ft/sot:ro
    restart: unless-stopped
    mem_limit: 128m
  optical:
    # the modelled L0 layer: computes optics and applies the resulting loss to the twin
    build: { context: .., dockerfile: optics/Dockerfile }
    image: fibertwin/optical-agent:0.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FT_ROOT}/build:/ft/build:ro
      - ${FT_ROOT}/sot:/ft/sot:ro
    ports: ["127.0.0.1:8081:8081"]
    restart: unless-stopped
    mem_limit: 128m
  analysis:
    # decides (SRLG correlation, what-if, verification) and acts through GitHub/Slack; tested with pytest
    build: { context: .., dockerfile: analysis/Dockerfile }
    image: fibertwin/analysis:0.1
    volumes:
      - ${FT_ROOT}/sot:/ft/sot:ro                       # the deployer's clone of main = the intended state
      - /opt/fibertwin/state:/ft/state:ro              # deployer's deployed_sha
      - /opt/fibertwin/secrets/github-token:/run/secrets/github-token:ro
      - /opt/fibertwin/secrets/slack-webhook:/run/secrets/slack-webhook:ro
      - analysis-data:/data
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    mem_limit: 192m
  n8n:
    # orchestrates the response playbook: order of steps, waits, escalation timer
    image: n8nio/n8n:2.45.7
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Africa/Tunis
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n-data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    ports: ["127.0.0.1:5678:5678"]
    restart: unless-stopped
    mem_limit: 512m
  loki:
    # logs + the Sigma-generated alert rules (ruler); Slice 3
    image: grafana/loki:3.6.11
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped
    mem_limit: 256m
  promtail:
    # ships the CPEs' sshd logs and Suricata's eve.json to Loki (Promtail is in maintenance mode upstream; fine for a lab)
    image: grafana/promtail:3.6.11
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/fibertwin/suricata:/var/log/suricata:ro
    restart: unless-stopped
    mem_limit: 128m
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    mem_limit: 384m
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${SLACK_WEBHOOK_FILE}:/etc/alertmanager/secrets/slack-webhook:ro
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped
    mem_limit: 64m
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/noc.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    mem_limit: 256m
volumes:
  loki-data:
  analysis-data:
  n8n-data:
  prom-data:
  grafana-data:
