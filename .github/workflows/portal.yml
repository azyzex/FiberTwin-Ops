name: portal

on:
  pull_request:
    paths: ["portal/**", "contracts/**", "sot/**", "netgen/**", "optics/**", "analysis/make_portal_data.py", ".github/workflows/portal.yml"]
  push:
    branches: [main]
    paths: ["portal/**", "contracts/**", "sot/**", "netgen/**", "optics/**", "analysis/make_portal_data.py", ".github/workflows/portal.yml"]

jobs:
  contract-and-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Validate data contract fixtures + recorded replay
        run: |
          pip install -r requirements.txt
          python contracts/validate.py replay contracts/examples/*.json portal/public/replay/*.json
      - name: Generate the What-if / Optical data from the current source of truth (same engines as CI)
        run: python analysis/make_portal_data.py

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: portal/package-lock.json }
      - name: Install
        working-directory: portal
        run: npm ci
      - name: Type check + build
        working-directory: portal
        run: npm run build
      - name: Browser tests (desktop + phone)
        working-directory: portal
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --grep-invert screenshot
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: portal/test-results }

  # Publish the portal (replay mode) to GitHub Pages on every push to main
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract-and-portal
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt && python analysis/make_portal_data.py
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: portal/package-lock.json }
      - working-directory: portal
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: portal/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
